name: Reviewed subtitle DB release
on:
  push:
    branches: [codex/reviewed-db-release-20261003]
    paths: ['.github/workflows/reviewed-db-release.yml', 'release-inputs/**', 'scripts/merge-reviewed-runtime.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: anime-db-refresh
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 pglast
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Merge, validate, back up and publish canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish-reviewed-release.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reviewed-release-validation
          path: deliverables/*.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reviewed-release-part-00
          path: deliverables/part_00/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: reviewed-release-part-01
          path: deliverables/part_01/*
          compression-level: 0
      - uses: actions/upload-artifact@v4
        if: success() && hashFiles('deliverables/part_02/*') != ''
        with:
          name: reviewed-release-part-02
          path: deliverables/part_02/*
          compression-level: 0
