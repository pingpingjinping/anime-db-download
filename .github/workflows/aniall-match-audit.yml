name: Aniall Match Audit

on:
  schedule:
    # Run after the four-source DB refresh on the 1st at 12:17 KST.
    - cron: '17 3 1 * *'
  workflow_dispatch:
    inputs:
      db_tag:
        description: "DB release tag"
        required: true
        default: "db-v1"
        type: string
      streaming_ref:
        description: "streaming-project branch/tag/commit to test"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download DB release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DB_TAG: ${{ inputs.db_tag || 'db-v1' }}
        run: |
          set -euo pipefail
          mkdir -p db
          gh release download "$DB_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "anime_four_sources_multilingual_prepared.zip" \
            --dir db \
            --clobber
          unzip -o db/anime_four_sources_multilingual_prepared.zip -d db
          test -f db/anime_four_sources_multilingual_prepared.db
          ls -lh db/anime_four_sources_multilingual_prepared.db

      - name: Fetch streaming-project audit branch
        shell: bash
        env:
          STREAMING_REF: ${{ inputs.streaming_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$STREAMING_REF" \
            https://github.com/pingpingjinping/streaming-project.git streaming-project
          test -f streaming-project/scripts/audit-aniall-subtitles.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run aniall match audit
        shell: bash
        run: |
          set -o pipefail
          python streaming-project/scripts/audit-aniall-subtitles.py \
            db/anime_four_sources_multilingual_prepared.db \
            --delay 1.2 \
            --out-dir aniall-audit | tee aniall-audit.log

      - name: Validate crawl and export safe matches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('aniall-audit.log').read_text()
          match = re.search(r'crawled posts\s*:\s*([\d,]+)\s*/ expected\s*([\d,]+)', log)
          if not match or int(match[1].replace(',', '')) != int(match[2].replace(',', '')):
              raise SystemExit('AniAll crawl incomplete; refusing to publish automatic mappings.')
          PY
          python streaming-project/scripts/export-aniall-auto-matches.py \
            aniall-audit/aniall_match_report.json \
            streaming-project/data/aniall-reviewed-matches.json \
            aniall-audit/aniall-auto-matches.json

      - name: Publish monthly AniAll mappings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="aniall-matches-$(date -u +%Y-%m)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" aniall-audit/aniall-auto-matches.json \
            --repo "$GITHUB_REPOSITORY" --title "$tag" \
            --notes 'Exact new AniAll posts after complete audit. Full review report remains in workflow artifact.' \
            --latest=false

      - name: Add results to summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Aniall Match Audit"
            echo
            echo "DB: ${{ inputs.db_tag }}"
            echo "streaming-project ref: ${{ inputs.streaming_ref }}"
            echo
            echo '```text'
            if [ -f aniall-audit.log ]; then
              sed -n '/=== aniall subtitle match audit ===/,$p' aniall-audit.log
            else
              echo "Audit log was not created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aniall-match-audit-${{ inputs.db_tag || 'db-v1' }}-${{ github.run_id }}
          path: |
            aniall-audit.log
            aniall-audit/
          if-no-files-found: warn
          retention-days: 90
