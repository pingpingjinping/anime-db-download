name: Aniall Match Audit

on:
  workflow_run:
    workflows: ["Monthly anime DB refresh"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      db_tag:
        description: "DB release tag"
        required: true
        default: "db-v1"
        type: string
      streaming_ref:
        description: "streaming-project branch/tag/commit to test"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  audit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Download DB release asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DB_TAG: ${{ inputs.db_tag || 'db-v1' }}
        run: |
          set -euo pipefail
          mkdir -p db
          gh release download "$DB_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "anime_four_sources_multilingual_prepared.zip" \
            --dir db \
            --clobber
          unzip -o db/anime_four_sources_multilingual_prepared.zip -d db
          test -f db/anime_four_sources_multilingual_prepared.db
          ls -lh db/anime_four_sources_multilingual_prepared.db

      - name: Fetch streaming-project audit branch
        shell: bash
        env:
          STREAMING_REF: ${{ inputs.streaming_ref || 'main' }}
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$STREAMING_REF" \
            https://github.com/pingpingjinping/streaming-project.git streaming-project
          test -f streaming-project/scripts/audit-aniall-subtitles.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load last AniAll post ID
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq '[.[] | select(.tag_name | startswith("aniall-matches-"))] | sort_by(.created_at) | last | .tag_name // ""')"
          if [ -n "$previous_tag" ]; then
            mkdir -p previous
            if ! gh release download "$previous_tag" --repo "$GITHUB_REPOSITORY" \
              --pattern aniall-crawl-state.json --dir previous; then
              echo 'Earlier AniAll release has no crawl baseline; using reviewed post IDs.'
            fi
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          previous = Path('previous/aniall-crawl-state.json')
          if previous.exists():
              baseline = int(json.loads(previous.read_text())['latest_post_id'])
          else:
              reviewed = json.loads(Path('streaming-project/data/aniall-reviewed-matches.json').read_text())
              baseline = max((int(row['postId']) for row in reviewed
                              if str(row.get('postId', '')).isdigit()), default=0)
          if baseline <= 0:
              raise SystemExit('No AniAll baseline available; refusing full archive crawl.')
          Path('aniall-since-post-id.txt').write_text(str(baseline))
          print(f'AniAll incremental baseline: post ID {baseline}')
          PY

      - name: Run aniall match audit
        shell: bash
        run: |
          set -o pipefail
          python streaming-project/scripts/audit-aniall-subtitles.py \
            db/anime_four_sources_multilingual_prepared.db \
            --since-post-id "$(cat aniall-since-post-id.txt)" \
            --delay 1.2 \
            --out-dir aniall-audit | tee aniall-audit.log

      - name: Validate crawl and export safe matches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          log = Path('aniall-audit.log').read_text()
          if 'baseline reached : yes' not in log:
              raise SystemExit('AniAll baseline not reached; refusing to publish mappings.')
          PY
          python streaming-project/scripts/export-aniall-auto-matches.py \
            aniall-audit/aniall_match_report.json \
            streaming-project/data/aniall-reviewed-matches.json \
            aniall-audit/aniall-auto-matches.json

      - name: Publish monthly AniAll mappings
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="aniall-matches-$(date -u +%Y-%m)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" \
            aniall-audit/aniall-auto-matches.json \
            aniall-audit/aniall-candidates.json \
            aniall-audit/aniall-crawl-state.json \
            --repo "$GITHUB_REPOSITORY" --title "$tag" \
            --notes 'New AniAll posts compared with refreshed DB; exact matches published. Review candidates remain in workflow artifact.' \
            --latest=false

      - name: Add results to summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Aniall Match Audit"
            echo
            echo "DB: ${{ inputs.db_tag }}"
            echo "streaming-project ref: ${{ inputs.streaming_ref }}"
            echo
            echo '```text'
            if [ -f aniall-audit.log ]; then
              sed -n '/=== aniall subtitle match audit ===/,$p' aniall-audit.log
            else
              echo "Audit log was not created."
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aniall-match-audit-${{ inputs.db_tag || 'db-v1' }}-${{ github.run_id }}
          path: |
            aniall-audit.log
            aniall-audit/
          if-no-files-found: warn
          retention-days: 90
