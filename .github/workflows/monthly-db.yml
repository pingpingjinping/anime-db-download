name: Monthly anime DB refresh

on:
  schedule:
    # First day of each month at 10:17 KST (01:17 UTC), after Pi's
    # 03:00 review preparation and 04:00 sanitized manifest upload.
    - cron: '17 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-db-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Confirm the first KST calendar day
        id: calendar
        run: |
          python3 - <<'PY'
          import datetime,os
          from zoneinfo import ZoneInfo
          now=datetime.datetime.now(ZoneInfo("Asia/Seoul"))
          if now.day != 1:
              raise SystemExit("Monthly db-v1 publication is restricted to the first KST calendar day")
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("month="+now.strftime("%Y-%m")+"\n")
          PY
      - name: Install updater dependencies
        run: python3 -m pip install requests beautifulsoup4
      - name: Run updater and reviewed-overlay unit tests
        run: |
          PYTHONPATH="$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/scripts" python3 -m unittest -v \
            scripts.test_update_db scripts.test_match_new_sources \
            scripts.test_reviewed_subtitle_runtime scripts.test_apply_pi_reviewed_groups \
            scripts.test_apply_pi_search_posters
      - name: Download published catalog and Pi's 04:00 monthly review
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.calendar.outputs.month }}
        run: |
          set -euo pipefail
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "pi-reviewed-work-groups-$MONTH.json" --dir "$RUNNER_TEMP"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern "anime_four_sources_multilingual_prepared_pi_reviewed_$MONTH.zip" --dir "$RUNNER_TEMP"
          sha256sum "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" \
            | cut -d ' ' -f 1 > "$RUNNER_TEMP/baseline-sha256.txt"
          cp "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" \
             "$RUNNER_TEMP/anime_four_sources_multilingual_prepared_backup.zip"
      - name: Verify Pi's 03:00 merged DB and use that published candidate
        env:
          MONTH: ${{ steps.calendar.outputs.month }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          month=os.environ["MONTH"]
          manifest=json.loads((root/("pi-reviewed-work-groups-"+month+".json")).read_text())
          if manifest.get("schema")!=1 or manifest.get("month")!=month:
              raise ValueError("Pi 04:00 upload belongs to another month")
          baseline=(root/"baseline-sha256.txt").read_text().strip()
          if manifest.get("base_release_sha256")!=baseline:
              raise ValueError("GitHub catalog changed between Pi 03:00 validation and 10:17 refresh")
          candidate=root/("anime_four_sources_multilingual_prepared_pi_reviewed_"+month+".zip")
          actual=hashlib.sha256(candidate.read_bytes()).hexdigest()
          if manifest.get("candidate_sha256")!=actual:
              raise ValueError("Pi 04:00 uploaded DB candidate does not match its SHA-256 manifest")
          candidate.replace(root/"anime_four_sources_multilingual_prepared.zip")
          PY
          python3 scripts/check_monthly_review_overlay.py \
            --archive "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" \
            --month "$MONTH"
          python3 - <<'PY'
          import gzip,os,pathlib,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          archive=root/"anime_four_sources_multilingual_prepared.zip"
          with zipfile.ZipFile(archive) as zf:
              members=[n for n in zf.namelist() if n.endswith((".db",".db.gz"))]
              if len(members)!=1: raise ValueError("Unexpected published Pi DB candidate ZIP structure")
              name=members[0]
              value=zf.read(name)
          db=gzip.decompress(value) if value.startswith(b"\x1f\x8b") else value
          (root/"anime-db-entry.txt").write_text(name,encoding="utf-8")
          with (root/"anime.db.gz").open("wb") as dst:
              with gzip.GzipFile(fileobj=dst,mode="wb",mtime=0,compresslevel=6) as zipout:
                  zipout.write(db)
          PY
      - name: Refresh sources and new-work matches, retaining reviewed overlay
        run: python3 scripts/update_db.py --snapshot "$RUNNER_TEMP/anime.db.gz" --online
      - name: Repackage and validate completed monthly database
        env:
          MONTH: ${{ steps.calendar.outputs.month }}
        run: |
          python3 - <<'PY'
          import gzip,hashlib,io,json,os,pathlib,sqlite3,tempfile,zipfile
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          archive=root/"anime_four_sources_multilingual_prepared.zip"
          entry=(root/"anime-db-entry.txt").read_text(encoding="utf-8")
          dbdata=gzip.decompress((root/"anime.db.gz").read_bytes())
          with tempfile.NamedTemporaryFile(suffix=".db") as dbfile:
              dbfile.write(dbdata);dbfile.flush()
              with sqlite3.connect(dbfile.name) as db:
                  if db.execute("PRAGMA quick_check").fetchone()[0]!="ok":
                      raise ValueError("Final monthly SQLite database integrity check failed")
                  existing={r[0] for r in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
                  if "pi_reviewed_work_groups" not in existing:
                      raise ValueError("Pi-reviewed month overlay vanished during source refresh")
                  saved=db.execute("SELECT value FROM pi_reviewed_work_groups_meta WHERE key='reviewed_month'").fetchone()
                  if not saved or saved[0]!=os.environ["MONTH"]:
                      raise ValueError("Wrong Pi-reviewed overlay month after source refresh")
                  source_counts=dict(db.execute("SELECT source,COUNT(*) FROM entries GROUP BY source"))
                  if not all(source_counts.get(name,0)>0 for name in ("AniList","Anissia","ReAnime","Onnada")):
                      raise ValueError("Four-source catalog incomplete after monthly update")
          blob=dbdata
          if entry.endswith(".gz"):
              stream=io.BytesIO()
              with gzip.GzipFile(fileobj=stream,mode="wb",compresslevel=6,mtime=0) as compressed:
                  compressed.write(dbdata)
              blob=stream.getvalue()
          output=root/"validated-monthly.zip"
          with zipfile.ZipFile(archive) as source,zipfile.ZipFile(output,"w") as dest:
              for member in source.infolist():
                  dest.writestr(member,blob if member.filename==entry else source.read(member))
          os.replace(output,archive)
          print("Final monthly db-v1 ZIP SHA-256:",hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Protect previous release and publish current catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(cat "$RUNNER_TEMP/baseline-sha256.txt")"
          mkdir -p "$RUNNER_TEMP/live"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP/live"
          current="$(sha256sum "$RUNNER_TEMP/live/anime_four_sources_multilingual_prepared.zip" | cut -d ' ' -f 1)"
          if [[ "$current" != "$expected" ]]; then
            echo "::error::Release catalog changed during monthly refresh; refusing overwrite" >&2
            exit 1
          fi
          gh release upload db-v1 "$RUNNER_TEMP/anime_four_sources_multilingual_prepared_backup.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload db-v1 "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" \
            --repo "$GITHUB_REPOSITORY" --clobber
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP/verify"
          cmp "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" \
              "$RUNNER_TEMP/verify/anime_four_sources_multilingual_prepared.zip"
      - name: Record successful release publication for Pi's day-two download
        env:
          GH_TOKEN: ${{ github.token }}
          MONTH: ${{ steps.calendar.outputs.month }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          month=os.environ["MONTH"]
          archive=pathlib.Path(os.environ["RUNNER_TEMP"])/"anime_four_sources_multilingual_prepared.zip"
          marker={
              "schema":1,"month":month,
              "catalog_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
              "finished_utc":datetime.datetime.now(datetime.timezone.utc).isoformat(),
          }
          (archive.parent/("monthly-db-refresh-"+month+".json")).write_text(
              json.dumps(marker,sort_keys=True)+"\n")
          PY
          gh release upload db-v1 "$RUNNER_TEMP/monthly-db-refresh-$MONTH.json" \
            --repo "$GITHUB_REPOSITORY" --clobber
