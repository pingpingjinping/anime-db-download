name: Monthly anime DB refresh

on:
  schedule:
    # 1st of each month, 10:17 KST (01:17 UTC)
    - cron: '17 1 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-db-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install HTML parser dependencies
        run: python3 -m pip install requests beautifulsoup4
      - name: Run updater unit tests
        run: cd scripts && python3 -m unittest -v test_update_db.py test_match_new_sources.py test_reviewed_subtitle_runtime.py
      - name: Download and unpack current Release snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import gzip, io, shutil, zipfile
          from pathlib import Path

          root = Path("${{ runner.temp }}")
          archive = root / "anime_four_sources_multilingual_prepared.zip"
          candidates = []
          with zipfile.ZipFile(archive) as zf:
              candidates = [name for name in zf.namelist()
                            if not name.endswith("/") and name.lower().endswith((".db", ".db.gz"))]
              if len(candidates) != 1:
                  raise SystemExit(f"Expected one SQLite DB in Release ZIP, found: {candidates}")
              entry = candidates[0]
              content = zf.read(entry)

          raw_db = root / "anime.db"
          source = gzip.GzipFile(fileobj=io.BytesIO(content)) if content.startswith(b"\\x1f\\x8b") else io.BytesIO(content)
          with source, raw_db.open("wb") as out:
              shutil.copyfileobj(source, out)
          packed = root / "anime.db.gz"
          with raw_db.open("rb") as src, packed.open("wb") as raw_out:
              with gzip.GzipFile(fileobj=raw_out, mode="wb", compresslevel=6, mtime=0) as dst:
                  shutil.copyfileobj(src, dst)
          (root / "anime-db-entry.txt").write_text(entry, encoding="utf-8")
          PY
      - name: Fail closed if last month's uploaded Pi review was not published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          previous_month="$(TZ=Asia/Seoul date -d "$(date -u +%Y-%m-01) -1 month" +%Y-%m)"
          asset="pi-reviewed-work-groups-$previous_month.json"
          asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/db-v1" \
            --jq ".assets[] | select(.name == \"$asset\") | .id" | head -n 1)"
          if [[ -n "$asset_id" ]]; then
            python3 scripts/check_monthly_review_overlay.py \
              --archive "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" \
              --month "$previous_month"
          else
            echo "No Pi reviewed manifest was submitted for $previous_month; retain existing catalog."
          fi
      - name: Refresh source catalogs and retry pending work matches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" \
            "$RUNNER_TEMP/anime_four_sources_multilingual_prepared_backup.zip"
          before="$(sha256sum "$RUNNER_TEMP/anime.db.gz" | cut -d ' ' -f 1)"
          python3 scripts/update_db.py --snapshot "$RUNNER_TEMP/anime.db.gz" --online
          after="$(sha256sum "$RUNNER_TEMP/anime.db.gz" | cut -d ' ' -f 1)"
          if [ "$before" = "$after" ]; then
            echo "No new or changed source records."
          else
            DB_ZIP_ENTRY="$(cat "$RUNNER_TEMP/anime-db-entry.txt")" python3 - <<'PY'
          import gzip, os, zipfile
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"])
          entry = os.environ["DB_ZIP_ENTRY"]
          raw_db = root / "anime.db"
          with gzip.open(root / "anime.db.gz", "rb") as src, raw_db.open("wb") as dst:
              while chunk := src.read(1024 * 1024):
                  dst.write(chunk)
          archive = root / "anime_four_sources_multilingual_prepared.zip"
          with zipfile.ZipFile(archive, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as zf:
              zf.write(raw_db, arcname=entry)
          PY
            gh release upload db-v1 "$RUNNER_TEMP/anime_four_sources_multilingual_prepared_backup.zip" --repo "$GITHUB_REPOSITORY" --clobber
            gh release upload db-v1 "$RUNNER_TEMP/anime_four_sources_multilingual_prepared.zip" --repo "$GITHUB_REPOSITORY" --clobber

            legacy_asset_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/db-v1" \
              --jq '.assets[] | select(.name == "anime_four_sources_multilingual_prepared_updated.zip") | .id' | head -n 1)"
            if [ -n "$legacy_asset_id" ]; then
              echo "Removing stale duplicate Release asset: $legacy_asset_id"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$legacy_asset_id"
            fi
          fi

      - name: Record successful first-day catalog refresh for Pi's second-day sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib
          month=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=9))).strftime('%Y-%m')
          archive=pathlib.Path(os.environ["RUNNER_TEMP"])/"anime_four_sources_multilingual_prepared.zip"
          marker={
            "schema":1, "month":month,
            "catalog_sha256":hashlib.sha256(archive.read_bytes()).hexdigest(),
            "finished_utc":datetime.datetime.now(datetime.timezone.utc).isoformat()
          }
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/f"monthly-db-refresh-{month}.json"
          path.write_text(json.dumps(marker,sort_keys=True)+"\n")
          PY
          month="$(TZ=Asia/Seoul date +%Y-%m)"
          gh release upload db-v1 "$RUNNER_TEMP/monthly-db-refresh-$month.json" \
            --repo "$GITHUB_REPOSITORY" --clobber

