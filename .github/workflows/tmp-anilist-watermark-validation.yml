name: Temporary AniList watermark validation

on:
  push:
    branches:
      - fix/anilist-watermark-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install requests beautifulsoup4
      - name: Run AniList incremental unit tests
        run: cd scripts && python3 -m unittest -v test_update_db.py
      - name: Validate current Release with live AniList ID scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import sqlite3
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import update_db

          archive = Path("${{ runner.temp }}") / "anime_four_sources_multilingual_prepared.zip"
          with zipfile.ZipFile(archive) as zf:
              candidates = [n for n in zf.namelist()
                            if not n.endswith("/") and n.lower().endswith((".db", ".db.gz"))]
              if len(candidates) != 1:
                  raise SystemExit(f"Expected one DB, found: {candidates}")
              raw = zf.read(candidates[0])

          if raw.startswith(b"\x1f\x8b"):
              import gzip
              raw = gzip.decompress(raw)

          db_path = Path("${{ runner.temp }}") / "validate.db"
          db_path.write_bytes(raw)
          db = sqlite3.connect(db_path)
          known = {
              str(row[0]) for row in db.execute(
                  "SELECT source_record_id FROM entries WHERE source='AniList'")
          }
          after_id = update_db.anilist_id_watermark(known)
          rows = list(update_db.anilist_rows(after_id))
          ids = [int(row["id"]) for row in rows]
          print({"stored_max_id": after_id, "new_rows": len(ids),
                 "new_id_min": min(ids) if ids else None,
                 "new_id_max": max(ids) if ids else None})
          if any(media_id <= after_id for media_id in ids):
              raise SystemExit("ID scan returned an item at or below the stored watermark")
          db.close()
          PY
