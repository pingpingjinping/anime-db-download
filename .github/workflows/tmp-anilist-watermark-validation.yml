name: Temporary AniList watermark validation

on:
  push:
    branches:
      - fix/anilist-watermark-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install requests beautifulsoup4
      - name: Run watermark unit tests
        run: cd scripts && python3 -m unittest -v test_update_db.py
      - name: Validate current Release snapshot bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import sqlite3
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import update_db

          archive = Path("${{ runner.temp }}") / "anime_four_sources_multilingual_prepared.zip"
          with zipfile.ZipFile(archive) as zf:
              candidates = [n for n in zf.namelist()
                            if not n.endswith("/") and n.lower().endswith((".db", ".db.gz"))]
              if len(candidates) != 1:
                  raise SystemExit(f"Expected one DB, found: {candidates}")
              raw = zf.read(candidates[0])

          if raw.startswith(b"\x1f\x8b"):
              import gzip
              raw = gzip.decompress(raw)

          db_path = Path("${{ runner.temp }}") / "validate.db"
          db_path.write_bytes(raw)
          db = sqlite3.connect(db_path)
          latest = update_db.latest_anilist_updated_at(db)
          saved = db.execute(
              "SELECT value FROM metadata WHERE key='anilist_updated_at_watermark'").fetchone()
          print({"saved_watermark": saved[0] if saved else None,
                 "snapshot_latest_updatedAt": latest})
          import time
          watermark, source = update_db.resolve_anilist_watermark(db, int(time.time()))
          since = watermark - update_db.ANILIST_OVERLAP_SECONDS
          print({"resolved_source": source, "watermark": watermark, "since": since})
          if source != "snapshot_generated_at":
              raise SystemExit(f"Expected snapshot_generated_at bootstrap, got {source}")

          known_ids = [
              int(row[0]) for row in db.execute(
                  "SELECT source_record_id FROM entries WHERE source='AniList'")
              if str(row[0]).isdigit()
          ]
          max_known_id = max(known_ids)
          query = """
          query ($page: Int!, $perPage: Int!, $idGreater: Int!) {
            Page(page: $page, perPage: $perPage) {
              media(type: ANIME, countryOfOrigin: JP,
                format_in: [TV, TV_SHORT, MOVIE, OVA, ONA],
                id_greater: $idGreater, sort: [ID]) { id updatedAt }
            }
          }
          """
          response = update_db.requests.post(
              update_db.ANILIST_URL,
              json={"query": query, "variables": {
                  "page": 1,
                  "perPage": update_db.ANILIST_PAGE_SIZE,
                  "idGreater": max_known_id,
              }},
              timeout=30,
          )
          response.raise_for_status()
          payload = response.json()
          if payload.get("errors"):
              raise SystemExit(payload["errors"])
          rows = payload.get("data", {}).get("Page", {}).get("media") or []
          ids = [int(row["id"]) for row in rows]
          print({"max_known_id": max_known_id, "new_id_rows": len(ids),
                 "first_ids": ids[:10]})
          if any(media_id <= max_known_id for media_id in ids):
              raise SystemExit("AniList id_greater returned an ID at or below the watermark")
          db.close()
          PY
