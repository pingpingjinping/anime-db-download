name: Temporary AniList watermark validation

on:
  push:
    branches:
      - fix/anilist-watermark-bootstrap

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: python3 -m pip install requests beautifulsoup4
      - name: Run watermark unit tests
        run: cd scripts && python3 -m unittest -v test_update_db.py
      - name: Validate current Release snapshot bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP"
          python3 - <<'PY'
          import sqlite3
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import update_db

          archive = Path("${{ runner.temp }}") / "anime_four_sources_multilingual_prepared.zip"
          with zipfile.ZipFile(archive) as zf:
              candidates = [n for n in zf.namelist()
                            if not n.endswith("/") and n.lower().endswith((".db", ".db.gz"))]
              if len(candidates) != 1:
                  raise SystemExit(f"Expected one DB, found: {candidates}")
              raw = zf.read(candidates[0])

          if raw.startswith(b"\x1f\x8b"):
              import gzip
              raw = gzip.decompress(raw)

          db_path = Path("${{ runner.temp }}") / "validate.db"
          db_path.write_bytes(raw)
          db = sqlite3.connect(db_path)
          latest = update_db.latest_anilist_updated_at(db)
          saved = db.execute(
              "SELECT value FROM metadata WHERE key='anilist_updated_at_watermark'").fetchone()
          print({"saved_watermark": saved[0] if saved else None,
                 "snapshot_latest_updatedAt": latest})
          print("metadata rows:")
          for key, value in db.execute("SELECT key, value FROM metadata ORDER BY key"):
              print(f"  {key}={value}")
          sample = db.execute(
              "SELECT source_record_id, source_metadata_json FROM entries WHERE source='AniList' LIMIT 3"
          ).fetchall()
          print("AniList metadata sample:", sample)
          db.close()
          PY
