name: Weekly subtitle discovery

on:
  schedule:
    # Saturday 04:00 KST (Friday 19:00 UTC), one day ahead of the Pi Sunday 04:00 download.
    - cron: '0 19 * * 5'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/discover_subtitles.py'
      - 'scripts/anissia_caption_policy.py'
      - 'scripts/test_anissia_caption_policy.py'
      - 'scripts/pi_download_subtitle_queues.py'
      - 'scripts/subtitle_queue_metadata.py'
      - 'scripts/test_subtitle_queue_metadata.py'
      - 'scripts/pi_weekly_subtitle_sync.sh'
      - 'state/subtitle-discovery.json'
      - 'requirements-pi-subtitles.txt'
      - 'ops/systemd/anime-weekly-subtitles.*'
      - '.github/workflows/monthly-subtitles.yml'

permissions:
  contents: write

concurrency:
  group: weekly-subtitle-discovery
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install requests beautifulsoup4 Pillow
      - name: Validate scripts
        shell: bash
        run: |
          python -m py_compile \
            scripts/discover_subtitles.py \
            scripts/anissia_caption_policy.py \
            scripts/pi_download_subtitle_queues.py \
            scripts/subtitle_queue_metadata.py \
            scripts/test_subtitle_queue_metadata.py \
            scripts/pi_download_erulabo.py
          python scripts/test_subtitle_queue_metadata.py
          python -m unittest discover -s scripts -p 'test_anissia_caption_policy.py' -v
          bash -n scripts/pi_weekly_subtitle_sync.sh

  discover:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run subtitle discovery from the main branch." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install discovery dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Discover new subtitle records
        shell: bash
        run: |
          python scripts/discover_subtitles.py \
            --state state/subtitle-discovery.json \
            --out "$RUNNER_TEMP/subtitle-discovery"

      - name: Read discovery summary
        id: summary
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "subtitle-discovery" / "summary.json"
          summary = json.loads(p.read_text())
          for key in ("queue_count", "aniall", "anissia", "api_failures", "anissia_scanned_works", "anissia_skipped_historical"):
              print(f"{key}={int(summary.get(key, 0))}")
          print(f"should_release={str(int(summary.get('queue_count', 0)) > 0).lower()}")
          PY

      - name: Publish subtitle queue Release
        if: steps.summary.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_COUNT: ${{ steps.summary.outputs.queue_count }}
          ANIALL_COUNT: ${{ steps.summary.outputs.aniall }}
          ANISSIA_COUNT: ${{ steps.summary.outputs.anissia }}
          API_FAILURES: ${{ steps.summary.outputs.api_failures }}
        run: |
          set -euo pipefail
          day="$(TZ=Asia/Seoul date +%Y-%m-%d)"
          tag="subs-queue-${day}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          notes="$RUNNER_TEMP/subtitle-queue-notes.txt"
          {
            echo "Weekly subtitle discovery queue"
            echo
            echo "- bootstrap cutoff: 2026-09-25 23:59:59 KST"
            echo "- queued: ${QUEUE_COUNT}"
            echo "- AniAll: ${ANIALL_COUNT}"
            echo "- Anissia: ${ANISSIA_COUNT}"
            echo "- Anissia API discovery failures: ${API_FAILURES}"
            echo
            echo "GitHub only discovered records. Subtitle pages/files are downloaded later by the Pi."
          } > "$notes"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Subtitle queue ${day}" \
            --notes-file "$notes"
          gh release upload "$tag" \
            "$RUNNER_TEMP/subtitle-discovery/subtitle-queue.json" \
            --repo "$GITHUB_REPOSITORY"

          if [[ -s "$RUNNER_TEMP/subtitle-discovery/discovery-failed.jsonl" ]]; then
            gh release upload "$tag" \
              "$RUNNER_TEMP/subtitle-discovery/discovery-failed.jsonl" \
              --repo "$GITHUB_REPOSITORY"
          else
            echo "No discovery failures; skipping empty discovery-failed.jsonl upload."
          fi

      - name: Commit discovery state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/subtitle-discovery.json
          if git diff --cached --quiet; then
            echo "Discovery state did not change."
            exit 0
          fi
          git commit -m "chore: update subtitle discovery state [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Add run summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Weekly subtitle discovery"
            echo
            echo "- queued: ${{ steps.summary.outputs.queue_count || 'n/a' }}"
            echo "- AniAll: ${{ steps.summary.outputs.aniall || 'n/a' }}"
            echo "- Anissia: ${{ steps.summary.outputs.anissia || 'n/a' }}"
            echo "- API discovery failures: ${{ steps.summary.outputs.api_failures || 'n/a' }}"
            echo "- Anissia caption APIs checked: ${{ steps.summary.outputs.anissia_scanned_works || 'n/a' }}"
            echo "- Historical caption APIs skipped: ${{ steps.summary.outputs.anissia_skipped_historical || 'n/a' }}"
            echo
            echo "No subtitle blog/file download happens on the GitHub runner."
          } >> "$GITHUB_STEP_SUMMARY"

