name: Anikoto reviewed catalog matching

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anikoto-catalog-matching
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Verify matching and protected database records
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Restore the completed saved listing without crawling
        run: python scripts/prepare_anikoto_catalog.py --db output/anikoto-catalog.sqlite --export-dir output/catalog
      - name: Download the current reviewed baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip --dir "$RUNNER_TEMP"
          python - <<'PY'
          import gzip, os, pathlib, zipfile
          root = pathlib.Path(os.environ['RUNNER_TEMP'])
          with zipfile.ZipFile(root/'anime_four_sources_multilingual_prepared.zip') as archive:
              candidates = [n for n in archive.namelist() if n.lower().endswith(('.db','.db.gz','.sqlite'))]
              if len(candidates) != 1:
                  raise ValueError('Expected exactly one SQLite baseline')
              data = archive.read(candidates[0])
          if data.startswith(b'\x1f\x8b'):
              data = gzip.decompress(data)
          (root/'baseline.db').write_bytes(data)
          PY
      - name: Match exact identities and apply reviewed catalog corrections to a copy
        run: |
          python scripts/match_anikoto.py --baseline "$RUNNER_TEMP/baseline.db" \
            --catalog output/anikoto-catalog.sqlite --output output/matching \
            --corrections data/anikoto/catalog-corrections.json \
            --corrected-db output/anime_four_sources_multilingual_prepared.db
      - name: Package matched database and review evidence
        run: |
          python - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path('output')
          with zipfile.ZipFile(root/'anime_anikoto_matched.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
              archive.write(root/'anime_four_sources_multilingual_prepared.db','anime_four_sources_multilingual_prepared.db')
              for file in sorted((root/'matching').glob('*')):
                  archive.write(file,file.name)
              archive.write('data/anikoto/catalog-corrections.json','catalog-corrections.json')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: anikoto-matched-database
          path: |
            output/anime_anikoto_matched.zip
            output/matching/anikoto-match-report.json
          if-no-files-found: error
          retention-days: 90
