name: Cloudflare anime search D1 sync

on:
  # Runs after the downstream writer of the final reviewed db-v1 catalog.
  # Monthly anime DB refresh -> Anikoto reviewed catalog matching -> D1.
  workflow_run:
    workflows: ["Anikoto reviewed catalog matching"]
    types: [completed]
    branches: [main]
  # Reconciliation in case the downstream workflow was skipped or failed.
  # 2nd of every month at 11:30 KST (02:30 UTC).
  schedule:
    - cron: '30 2 2 * *'
  # An explicit pinned Release reconciliation request; new catalog ZIPs alone
  # do not trigger this workflow through GitHub's release asset API.
  push:
    branches: [main]
    paths: ['data/matching/cloudflare-sync-request.json']
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry-run validates the export without touching Cloudflare"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish

permissions:
  contents: read

concurrency:
  group: cloudflare-anime-search-d1
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test search exporter
        run: python3 -m unittest discover -s scripts -p 'test_export_cloudflare_search_sql.py' -v
      - name: Download reviewed Release assets (no subtitles or private user data)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/cloudflare-search"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern 'anime_four_sources_multilingual_prepared.zip' \
            --pattern 'anime_reviewed_subtitle_registry_v1.zip' \
            --dir "$RUNNER_TEMP/cloudflare-search" --clobber
          test -s "$RUNNER_TEMP/cloudflare-search/anime_four_sources_multilingual_prepared.zip"
          test -s "$RUNNER_TEMP/cloudflare-search/anime_reviewed_subtitle_registry_v1.zip"
      - name: Verify explicitly requested db-v1 asset hashes
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          req=json.loads(pathlib.Path("data/matching/cloudflare-sync-request.json").read_text())
          assert req["schema"]==1 and req["release_tag"]=="db-v1"
          base=pathlib.Path(os.environ["RUNNER_TEMP"])/"cloudflare-search"
          for name, expected in req["expected_sha256"].items():
              if name not in (
                  "anime_four_sources_multilingual_prepared.zip",
                  "anime_reviewed_subtitle_registry_v1.zip",
              ): raise ValueError("Unexpected release asset name: "+name)
              actual=hashlib.sha256((base/name).read_bytes()).hexdigest()
              if actual != expected: raise ValueError("db-v1 Release changed: "+name)
              print(name,"SHA256 verified:",actual)
          PY
      - name: Extract and validate SQLite assets
        run: |
          set -euo pipefail
          python3 scripts/extract_cloudflare_search_releases.py \
            "$RUNNER_TEMP/cloudflare-search/anime_four_sources_multilingual_prepared.zip" \
            "$RUNNER_TEMP/cloudflare-search/catalog.db"
          python3 scripts/extract_cloudflare_search_releases.py \
            "$RUNNER_TEMP/cloudflare-search/anime_reviewed_subtitle_registry_v1.zip" \
            "$RUNNER_TEMP/cloudflare-search/registry.db"
      - name: Build conservative search projection
        run: |
          set -euo pipefail
          python3 scripts/export_cloudflare_search_sql.py \
            --catalog "$RUNNER_TEMP/cloudflare-search/catalog.db" \
            --registry "$RUNNER_TEMP/cloudflare-search/registry.db" \
            --output "$RUNNER_TEMP/cloudflare-search/import.sql" \
            --manifest "$RUNNER_TEMP/cloudflare-search/manifest.json" \
            --max-rows 35000
      - uses: actions/setup-node@v4
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'publish' }}
        with:
          node-version: '22'
      - name: Import reviewed search metadata into Cloudflare D1
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'publish' }}
        id: publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$CLOUDFLARE_D1_DATABASE_ID" ]; then
            echo 'Missing Cloudflare D1 credentials; configure repository Actions Secrets and Variables.' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/cloudflare-search/wrangler.toml" <<'TOML'
          name = "anime-search-d1-sync"
          compatibility_date = "2026-10-01"
          [[d1_databases]]
          binding = "DB"
          database_name = "anime-search-db"
          database_id = "__DATABASE_ID__"
          TOML
          python3 - <<'PY'
          import os
          from pathlib import Path
          file = Path(os.environ['RUNNER_TEMP']) / 'cloudflare-search/wrangler.toml'
          file.write_text(file.read_text().replace('__DATABASE_ID__',os.environ['CLOUDFLARE_D1_DATABASE_ID']), encoding='utf-8')
          PY
          # Metadata is separate from public search tables and survives index replacements.
          npx --yes wrangler@4 d1 execute anime-search-db \
            --config "$RUNNER_TEMP/cloudflare-search/wrangler.toml" \
            --remote --yes --command \
            "CREATE TABLE IF NOT EXISTS anime_search_sync_metadata (key TEXT PRIMARY KEY, sql_sha256 TEXT NOT NULL, works INTEGER NOT NULL, aliases INTEGER NOT NULL, updated_at TEXT NOT NULL);"

          # Avoid a full DELETE/re-INSERT of ~19k index rows when the same verified
          # search projection is already deployed. Count checks catch truncated DBs.
          npx --yes wrangler@4 d1 execute anime-search-db \
            --config "$RUNNER_TEMP/cloudflare-search/wrangler.toml" \
            --remote --json --command \
            "SELECT sql_sha256, works, aliases, (SELECT COUNT(*) FROM works) AS actual_works, (SELECT COUNT(*) FROM work_aliases) AS actual_aliases FROM anime_search_sync_metadata WHERE key='db-v1';" \
            > "$RUNNER_TEMP/cloudflare-search/sync-state.json"
          python3 scripts/cloudflare_sync_guard.py check \
            --manifest "$RUNNER_TEMP/cloudflare-search/manifest.json" \
            --wrangler-json "$RUNNER_TEMP/cloudflare-search/sync-state.json" \
            --github-output "$GITHUB_OUTPUT"
          if grep -qx 'skip=true' "$GITHUB_OUTPUT"; then
            echo "Cloudflare D1 already contains the identical verified search index; skipping."
            echo "### Cloudflare D1 sync: unchanged index (no import)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          npx --yes wrangler@4 d1 execute anime-search-db \
            --config "$RUNNER_TEMP/cloudflare-search/wrangler.toml" \
            --remote --yes --file "$RUNNER_TEMP/cloudflare-search/import.sql"
          npx --yes wrangler@4 d1 execute anime-search-db \
            --config "$RUNNER_TEMP/cloudflare-search/wrangler.toml" \
            --remote --json --command \
            'SELECT COUNT(*) AS works FROM works; SELECT COUNT(*) AS aliases FROM work_aliases;' \
            > "$RUNNER_TEMP/cloudflare-search/counts.json"
          python3 scripts/cloudflare_sync_guard.py verify \
            --manifest "$RUNNER_TEMP/cloudflare-search/manifest.json" \
            --wrangler-json "$RUNNER_TEMP/cloudflare-search/counts.json"

          # Advance sync state only after the remote tables passed verification.
          read -r digest works aliases < <(python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ["RUNNER_TEMP"]) / "cloudflare-search/manifest.json").read_text())
          print(data["sql_sha256"], int(data["works"]), int(data["aliases"]))
          PY
          )
          npx --yes wrangler@4 d1 execute anime-search-db \
            --config "$RUNNER_TEMP/cloudflare-search/wrangler.toml" \
            --remote --yes --command \
            "INSERT INTO anime_search_sync_metadata (key,sql_sha256,works,aliases,updated_at) VALUES ('db-v1','$digest',$works,$aliases,strftime('%Y-%m-%dT%H:%M:%SZ','now')) ON CONFLICT(key) DO UPDATE SET sql_sha256=excluded.sql_sha256, works=excluded.works, aliases=excluded.aliases, updated_at=excluded.updated_at;"
          echo "### Cloudflare D1 sync: published ${works} works and ${aliases} aliases" >> "$GITHUB_STEP_SUMMARY"
