name: Anikoto catalog crawl

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Use the saved DB or check newly added website entries
        type: choice
        options:
          - use_existing
          - refresh
        default: use_existing
        required: true
      base_url:
        description: Anikoto website origin
        default: https://anikoto.cz
        required: true
      max_pages:
        description: Page budget (0 = until two known pages or the last page)
        default: '0'
        required: true
      resume:
        description: Reuse the latest artifact (otherwise use the checked-in initial DB)
        type: boolean
        default: true
      full_scan:
        description: Ignore overlap checkpoints and scan every page (refresh mode)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: anikoto-catalog-crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Verify the listing collector
        run: |
          python -m unittest discover -s scripts -p 'test_crawl_anikoto.py' -v
          python -m unittest discover -s scripts -p 'test_prepare_anikoto_catalog.py' -v
      - name: Restore the latest crawl artifact when requested
        if: inputs.resume
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=anikoto-catalog&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | .[0].id // empty')"
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/anikoto-catalog.zip"
            python - <<'PY'
          import os, pathlib, zipfile
          with zipfile.ZipFile(pathlib.Path(os.environ['RUNNER_TEMP'])/'anikoto-catalog.zip') as archive:
              pathlib.Path('output/anikoto-catalog.sqlite').write_bytes(archive.read('anikoto-catalog.sqlite'))
          PY
          fi
      - name: Prepare and export the saved catalog without crawling
        run: python scripts/prepare_anikoto_catalog.py --db output/anikoto-catalog.sqlite --export-dir output
      - name: Refresh Anikoto additions only when selected
        if: inputs.mode == 'refresh'
        env:
          ANIKOTO_BASE_URL: ${{ inputs.base_url }}
          ANIKOTO_MAX_PAGES: ${{ inputs.max_pages }}
          ANIKOTO_FULL_SCAN: ${{ inputs.full_scan }}
        run: |
          scan_options=()
          if [[ "$ANIKOTO_FULL_SCAN" == true ]]; then
            scan_options+=(--full --fresh)
          fi
          python scripts/crawl_anikoto.py --db output/anikoto-catalog.sqlite \
            --base-url "$ANIKOTO_BASE_URL" --max-pages "$ANIKOTO_MAX_PAGES" \
            --delay 1.2 --export-dir output "${scan_options[@]}"
      - name: Preserve completed or partial crawl and resume checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anikoto-catalog
          path: |
            output/anikoto-catalog.sqlite
            output/anikoto-catalog.jsonl
            output/anikoto-crawl-report.json
          if-no-files-found: ignore
          retention-days: 90

