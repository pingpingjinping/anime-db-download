name: Database regression
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/database-regression.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/database-regression.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
