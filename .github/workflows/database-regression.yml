name: Database regression
on:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/database-regression.yml']
  pull_request:
    paths: ['scripts/**', '.github/workflows/database-regression.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4 Pillow
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v

  release-layout:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current db-v1 layout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/current" "$RUNNER_TEMP/split"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_four_sources_multilingual_prepared.zip \
            --dir "$RUNNER_TEMP/current"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" \
            --pattern anime_reviewed_subtitle_registry_v1.zip \
            --dir "$RUNNER_TEMP/current" || true
      - name: Validate current release or measure legacy split
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/current/anime_reviewed_subtitle_registry_v1.zip" ]]; then
            python scripts/split_db_v1_release.py validate \
              --catalog "$RUNNER_TEMP/current/anime_four_sources_multilingual_prepared.zip" \
              --registry "$RUNNER_TEMP/current/anime_reviewed_subtitle_registry_v1.zip" \
              | tee "$RUNNER_TEMP/release-layout.json"
          else
            python scripts/split_db_v1_release.py split \
              --source "$RUNNER_TEMP/current/anime_four_sources_multilingual_prepared.zip" \
              --output "$RUNNER_TEMP/split" \
              | tee "$RUNNER_TEMP/release-layout.json"
          fi
      - name: Publish size summary
        run: |
          python - <<'PY'
          import json, os, pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-layout.json'
          data=json.loads(p.read_text())
          with pathlib.Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as out:
              out.write('## db-v1 release layout\n\n')
              out.write(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          PY
