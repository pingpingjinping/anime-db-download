name: Inspect body-reviewed release mappings
on:
  push:
    branches: ['codex/body-audit-release-20261011']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download current split release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/review-input"
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" --pattern anime_four_sources_multilingual_prepared.zip --pattern anime_reviewed_subtitle_registry_v1.zip --dir "$RUNNER_TEMP/review-input"
      - name: Inspect exact reviewed keys without publishing
        run: python3 scripts/inspect_audit_release_20261011.py "$RUNNER_TEMP/review-input"
