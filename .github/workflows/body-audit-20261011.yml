name: Build body-reviewed release 20261011
on:
  push:
    branches: [codex/body-audit-release-20261011]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p body-input
          gh release download db-v1 --repo "$GITHUB_REPOSITORY" --pattern anime_four_sources_multilingual_prepared.zip --pattern anime_reviewed_subtitle_registry_v1.zip --dir body-input
      - name: Build and verify exact body corrections
        run: python scripts/build_body_audit_release_20261011.py --input body-input --output body-output
      - uses: actions/upload-artifact@v4
        with:
          name: body-audit-20261011-build
          path: body-output/
          retention-days: 30
